trigger:
  branches:
    include:
      - DEV

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Use Node 18'
- script: npm ci
  displayName: 'Install dependencies'
- script: npm run build
  displayName: 'Build app'
- task: AzureStaticWebApp@0
  inputs:
    app_location: '/'
    api_location: 'api'
    output_location: 'dist'
    azure_static_web_apps_api_token: $(production_deployment_token)
- script: |
    set -euo pipefail
    sudo apt-get update -y
    sudo apt-get install -y jq curl

    ROOT_URL="https://brave-pebble-03845af10.3.azurestaticapps.net"

    echo "Checking root page..."
    root_html=$(curl -sS "$ROOT_URL/")
    echo "$root_html" | grep -q "Learn with 365" || (echo "Root content check failed"; echo "$root_html"; exit 1)

    echo "Checking /api/courses..."
    api_json=$(curl -sS "$ROOT_URL/api/courses")
    echo "$api_json" | jq -e 'type == "array"' >/dev/null || (echo "API did not return a JSON array"; echo "$api_json"; exit 1)
    echo "API returned $(echo "$api_json" | jq length) items"
  displayName: 'Smoke tests: root + /api/courses'
